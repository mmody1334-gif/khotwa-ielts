name: Build listening audio
on:
  push:
    branches: [main, features-v4]
    paths:
      - 'shared/content.json'
      - 'scripts/make_audio.py'
      - '.github/workflows/audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Piper and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts
      - name: Download voices (rhasspy/piper-voices)
        run: |
          mkdir -p /tmp/voices
          for v in cori alan jenny_dioco northern_english_male; do
            n="en_GB-$v-medium"; base="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/$v/medium"
            curl -sfL -o /tmp/voices/$n.onnx "$base/$n.onnx" && curl -sfL -o /tmp/voices/$n.onnx.json "$base/$n.onnx.json" || echo "missing $n"
            curl -sfL -o /tmp/voices/$n.MODEL_CARD "$base/MODEL_CARD" || true
          done
          ls -la /tmp/voices
      - name: Build audio
        run: python scripts/make_audio.py
      - name: Voice credits
        run: |
          { echo "# Listening voices"; echo; echo "Generated with Piper (https://github.com/rhasspy/piper) voices from https://huggingface.co/rhasspy/piper-voices."; echo; for f in /tmp/voices/*.MODEL_CARD; do echo "## $(basename $f .MODEL_CARD)"; echo; cat "$f"; echo; done; } > shared/audio/VOICES.md
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add shared/audio
          git commit -m "Listening audio from ${GITHUB_SHA::7}" || exit 0
          git pull --rebase -q || true
          git push
