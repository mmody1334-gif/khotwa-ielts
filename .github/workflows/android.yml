name: Build Android APK
on:
  push:
    branches: [main, ext-tests]
    paths:
      - 'android-app/**'
      - 'shared/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Restore signing key from secrets
        env:
          KS_B64: ${{ secrets.KHOTWA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/khotwa.jks"; echo "KHOTWA_KEYSTORE=$RUNNER_TEMP/khotwa.jks" >> "$GITHUB_ENV"; echo "Using release key";
          else echo "::warning::KHOTWA_KEYSTORE_B64 secret missing, APK is signed with a temporary debug key and cannot update older installs"; fi
      - name: Build release APK
        env:
          KHOTWA_STORE_PASS: ${{ secrets.KHOTWA_STORE_PASS }}
        run: gradle -p android-app assembleRelease --no-daemon --stacktrace
      - name: Copy APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk khotwa-ielts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-ielts-apk
          path: khotwa-ielts.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test and screenshots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash android-app/ci/shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
      - name: Push screenshots to ci-shots branch
        if: always() && github.ref != 'refs/heads/main'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
      - name: Publish release and site APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest khotwa-ielts.apk --title "Khotwa IELTS Android APK" --notes "Native Android build from commit ${GITHUB_SHA}."
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add khotwa-ielts.apk
          git commit -m "Update site APK from ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
