name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: khotwa-ielts-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test and screenshots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash android-app/ci/shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk khotwa-ielts.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest khotwa-ielts.apk --title "Khotwa IELTS Android APK (debug-signed)" --notes "Native Android build from commit ${GITHUB_SHA}."
